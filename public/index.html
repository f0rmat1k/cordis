<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cordis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#5865f2">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="main" class="screen">
    <header>
      <h1>cordis</h1>
      <button id="copy-link" class="ghost">Скопировать ссылку</button>
    </header>

    <button id="sound-banner" class="banner hidden">🔊 Нажмите, чтобы включить звук</button>

    <div class="card">
      <h2 id="call-title">Подключение…</h2>
      <ul id="tiles"></ul>
      <p id="alone" class="muted small hidden">Кроме вас никого нет. Отправьте друзьям ссылку — они сразу окажутся в звонке.</p>
      <div class="row center controls">
        <button id="mute">Выкл. микрофон</button>
        <button id="mic-retry" class="primary hidden">Разрешить микрофон</button>
      </div>
    </div>

    <div class="card">
      <h2>Настройки</h2>
      <label>Ваше имя
        <span class="row">
          <input id="name" autocomplete="off" maxlength="24">
          <button type="button" id="name-random" class="icon ghost" title="Случайное имя">🎲</button>
        </span>
      </label>
      <label>Шумоподавление <select class="ns-select"></select></label>
      <label class="strength"><span>Сила подавления: <b class="ns-strength-value"></b></span><input type="range" class="ns-strength" min="10" max="100" step="5"></label>
      <label>Микрофон <select id="mic-select"><option value="">По умолчанию</option></select></label>
      <div class="row">
        <button id="mic-test">Слышать себя</button>
        <div class="meter"><div class="meter-fill"></div></div>
      </div>
      <p class="muted small">«Слышать себя» — проверка шумодава, надевайте наушники.</p>
    </div>

    <div id="debug" class="card hidden">
      <div class="row"><h2>Отладка</h2><button id="debug-copy" class="ghost">Скопировать</button></div>
      <pre id="debug-out"></pre>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <div id="audios" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
